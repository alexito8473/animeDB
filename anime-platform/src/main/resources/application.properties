spring.application.name=anime-platform
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=20GB

# Multimedia storage
app.storage.root=${MEDIA_ROOT:/srv/anime-platform/media}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.flyway.baseline-on-migrate=true

app.media-storage-root=/srv/anime-platform/media