name: Deploy AnimeDB

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-animedb-master
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: self-hosted

    steps:
      - name: Update code and build backend
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ACTUALIZANDO CODIGO ====="

          cd /opt/anime-platform

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Hay cambios locales en /opt/anime-platform."
            git status --short
            exit 1
          fi

          git fetch origin master
          git merge --ff-only origin/master

          echo "===== COMPILANDO BACKEND ====="

          cd /opt/anime-platform/anime-platform

          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

          test -f target/anime-platform-0.0.1-SNAPSHOT.jar

          echo "===== COMPILACION COMPLETADA ====="

      - name: Restart backend container
        shell: bash
        run: |
          set -euo pipefail

          echo "===== REINICIANDO BACKEND ====="

          cd /opt/anime-platform

          docker compose up -d --no-deps --force-recreate backend

          echo "===== CONTENEDOR RECREADO ====="

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail

          echo "===== VERIFICANDO API ====="

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:8080/v3/api-docs \
              >/dev/null; then
              echo "OK: AnimeDB backend responde correctamente."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: El backend no responde despues del despliegue."

          docker logs --tail 100 anime-backend

          exit 1
